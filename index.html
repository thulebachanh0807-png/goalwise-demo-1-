.bankbrand{font-size:21px;font-weight:900;letter-spacing:-.7px;border-radius:12px;padding:16px;margin:13px 0}.bankcard .metric{font-size:21px}.bankcard{border-top:3px solid var(--pink)}.legacy-bank{--pink:#d82d8b;--pink-deep:#a91169;--pink-soft:#ffedf5;--ink:#322033;--muted:#827383;--line:#efdce6;--bg:#fff9fc;--green:#187957;--green-bg:#eaf8f2;--warn:#a45b1c;--warn-bg:#fff5e6;--red:#ba3b58;--shadow:0 16px 52px rgba(135,37,88,.09)}

<script>

['S02','SCOLI 2025','https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2026/04/thong-cao-bao-chi-chi-so-gia-sinh-hoat-theo-khong-gian-nam-2025/','Hà Nội 100; TP.HCM 97,96. Không suy ra chênh lệch cấp quận.'],
['S03','Khảo sát mức sống dân cư 2024','https://www.nso.gov.vn/tin-tuc-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/','Chi tiêu bình quân thành thị 3,8 triệu; nông thôn 2,5 triệu/người/tháng. Không phải mức sống tối thiểu cá nhân.'],
['S06','CFPB — Your Money, Your Goals','https://www.consumerfinance.gov/consumer-tools/educator-tools/your-money-your-goals/toolkit/','Theo dõi dòng tiền và lập ngân sách.'],

['S09','CFPB — Emergency Fund','https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/','Bảo vệ quỹ dự phòng.'],
['S15','Gargano & Rossi — Goal Setting and Saving in the FinTech Era','https://doi.org/10.1111/jofi.13339','Cơ sở nghiên cứu thiết lập mục tiêu; chưa chứng minh hiệu quả riêng của GoalWise.'],

const demoBanks=[{name:'Sản phẩm mô phỏng A',min:100000,terms:{1:4.1,3:4.5,6:6.5,12:6.6},partial:true,minPartial:100000,remain:100000,early:.1},{name:'Sản phẩm mô phỏng B',min:1000000,terms:{1:3.9,3:4.8,6:5.8,12:6.2},partial:false,minPartial:0,remain:0,early:.1}];

const sum=a=>a.reduce((x,y)=>x+y,0), cash=n=>Math.round(n).toLocaleString('vi-VN')+' ₫', num=n=>Math.max(0,Number(n)||0), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){let tx=[];for(let m=0;m<3;m++){tx.push({m,cat:'income',kind:'income',amount:9000000,merchant:'Lương mô phỏng'});for(const [id,label,a] of C){let value=a;if(m===0&&id==='shopping')value=600000;if(m===1&&id==='fun')value=400000;if(m===0&&id==='subscriptions')value=100000;if(value){tx.push({m,cat:id,kind:'expense',amount:value+(id==='shopping'?100000:0),merchant:label});if(id==='shopping')tx.push({m,cat:id,kind:'refund',amount:100000,merchant:'Hoàn tiền mua sắm'});}}tx.push({m,cat:'transfer',kind:'transfer',amount:500000,merchant:'Chuyển giữa tài khoản'});}return {consent:false,monitor:false,tx,goal:{name:'Mua laptop',price:18000000,saved:2000000,months:8,inflation:0,city:'HCM',area:'urban',housing:'rent',reserve:300000,debt:0},floors:{shopping:500000,fun:400000,subscriptions:100000},confirmed:false,locks:{},draft:null,approved:null,actual:{},alerts:[],threshold:90};}
let s;try{s=JSON.parse(localStorage.getItem('goalwise_v13'))||seed()}catch{s=seed()}let page='home', simulation=null;
function save(){try{localStorage.setItem('goalwise_v13',JSON.stringify(s))}catch{}}
function stats(m){let cats=Object.fromEntries(C.map(c=>[c[0],0])),income=0;for(const t of s.tx.filter(t=>t.m===m)){if(t.kind==='income')income+=t.amount;if(t.kind==='expense'&&t.cat in cats)cats[t.cat]+=t.amount;if(t.kind==='refund'&&t.cat in cats)cats[t.cat]-=t.amount;}for(const k in cats)cats[k]=Math.max(0,cats[k]);return {cats,income,expenses:sum(Object.values(cats))}}
function calculation(){const x=stats(2),g=s.goal,future=Math.ceil(g.price*Math.pow(1+g.inflation/100,g.months/12)),gap=Math.max(0,future-g.saved),required=Math.ceil(gap/g.months),capacity=x.income-x.expenses-g.debt-g.reserve;return {x,g,future,gap,required,capacity,shortfall:Math.max(0,required-capacity)}}
function floor(k,x){return !optional.includes(k)||s.locks[k]||!s.confirmed?x:Math.min(x,num(s.floors[k]))}
function optimize(){s.aiOrigin="Quy tắc offline";s.aiReason="";s.aiReasons={};const q=calculation();let plan={...q.x.cats},need=q.shortfall;for(const k of ['subscriptions','fun','shopping']){const cut=Math.min(need,Math.max(0,plan[k]-floor(k,plan[k])));plan[k]-=cut;need-=cut;}s.draft=plan;save();return plan}
function evaluate(plan){const q=calculation(),total=sum(Object.values(plan)),capacity=q.x.income-total-q.g.debt-q.g.reserve;return {...q,total,after:capacity,feasible:capacity>=q.required,eta:capacity>0?Math.ceil(q.gap/capacity):q.gap===0?0:null}}
function history(k){return [0,1,2].map(m=>stats(m).cats[k])}
function invalidate(){s.confirmed=false;s.draft=null;if(s.approved){s.approved=null;s.monitor=false;s.alerts=[];s.actual={}}save()}
function go(p){if(aiBusy)return;if(page==='plan'&&!s.draft&&['monitor','saving','bank'].includes(p)){const cb=document.getElementById('confirmFloor');if(cb){document.getElementById('floorNotice').textContent='Bạn cần xác nhận mức chi tối thiểu, tạo đề xuất và duyệt kế hoạch trước khi tiếp tục.';cb.focus();return}}page=p;simulation=null;render();window.scrollTo(0,0)}
function field(label,key,type='number'){return '<label class="field"><span>'+label+'</span><input id="'+key+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(s.goal[key])+'"></label>'}
function select(label,key,options){return '<label class="field"><span>'+label+'</span><select id="'+key+'">'+options.map(([v,l])=>'<option value="'+v+'" '+(s.goal[key]===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'}
function metric(label,value,cls=''){return '<div><small>'+label+'</small><div class="metric '+cls+'">'+value+'</div></div>'}
function contextHtml(){let g=s.goal,city=g.city==='HN'?'Hà Nội: SCOLI 100':g.city==='HCM'?'TP.HCM: SCOLI 97,96':'Chưa có chỉ số thành phố phù hợp trong database';let area=g.area==='urban'?'Chi tiêu bình quân thành thị: 3,8 triệu ₫/người/tháng.':g.area==='rural'?'Chi tiêu bình quân nông thôn: 2,5 triệu ₫/người/tháng.':'Chưa có benchmark phù hợp cấp ngoại thành hoặc khu vực chưa xác định.';return '<div class="warn"><strong>Tham chiếu hoàn cảnh [S02, S03]</strong><br>'+city+' · '+area+'<br><small>Chỉ dùng để rà soát thông tin còn thiếu. Không thay thế chi phí thực tế hoặc tự cắt ngân sách.</small></div>'}
function sourceHtml(){return '<details><summary>Cơ sở đề xuất và giới hạn dữ liệu</summary>'+sources.map(a=>'<p><a target="_blank" rel="noopener" href="'+a[2]+'">'+a[0]+' · '+a[1]+'</a><br><small>'+a[3]+'</small></p>').join('')+'<small>Nguồn kế thừa từ database nghiên cứu, chưa kiểm tra trực tuyến trong bản này. Ngưỡng 75/90/100% và dữ liệu giao dịch là giả định demo.</small></details>'}
function bar(p,c='var(--bright)'){return '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+c+'"></i></div>'}
function header(t,d){return '<h1>'+t+'</h1>'+(d?'<p class="muted">'+d+'</p>':'')}
function render(){if(!s.confirmed&&!s.approved)s.draft=null;let q=calculation(),h='';document.getElementById('nav').innerHTML=[['home','⌂','Tổng quan'],['plan','✦','Kế hoạch'],['monitor','◎','Mục tiêu'],['saving','₫','Tiết kiệm']].map(([k,i,l])=>'<button class="'+(page===k||(k==='saving'&&page==='bank')?'active':'')+'" onclick="go(\''+k+'\')"><b>'+i+'</b>'+l+'</button>').join('');
if(page==='home'){if(!s.consent){h='<div class="hero"><small>QUẢN LÝ CHI TIÊU · TÍNH NĂNG ĐỀ XUẤT</small><h1>Chi tiêu thông minh hơn.<br>Đạt mục tiêu nhanh hơn.</h1><p>Biến lịch sử giao dịch thành kế hoạch tài chính cá nhân.</p><button onclick="go(\'consent\')">Lập kế hoạch cùng AI →</button></div><div class="card"><h2>Hiểu · Tối ưu · Theo dõi · Tiết kiệm</h2><p>Không cần nhập lại mọi giao dịch. GoalWise sử dụng dữ liệu đã phân loại (mô phỏng) để tính ngân sách theo mục tiêu.</p></div>'}else{const colors=['#a50064','#d82d8b','#ed9bc7','#9066aa','#e9b15f','#9db7bd','#aa588a','#e8c6da','#648b95','#d5cbd4'];let start=0;const slices=C.map(([k],i)=>{let end=start+(q.x.expenses?q.x.cats[k]/q.x.expenses*100:0);let v=colors[i]+' '+start+'% '+end+'%';start=end;return v});h=header('Bức tranh tài chính của bạn','Minh Anh · Dữ liệu mô phỏng')+'<div class="hero"><small>Thu nhập tháng</small><div class="progress">'+cash(q.x.income)+'</div><div class="grid">'+metric('Tổng chi',cash(q.x.expenses))+metric('Tiền dư sau dự phòng',cash(q.capacity))+'</div></div><div class="card"><h2>Phân bổ chi tiêu</h2><div class="row"><div class="donut" style="background:conic-gradient('+slices.join(',')+')"><div><small>Tổng chi</small><strong>'+cash(q.x.expenses)+'</strong></div></div><div class="legend">'+C.map(([k,l],i)=>'<div><span><i style="background:'+colors[i]+'"></i>'+l+'</span><b>'+cash(q.x.cats[k])+'</b></div>').join('')+'</div></div></div><div class="card"><h2>Giao dịch đã phân loại</h2>'+C.map(([k,l])=>'<details><summary>'+l+' · '+cash(q.x.cats[k])+'</summary>'+s.tx.filter(t=>t.m===2&&t.cat===k).map(t=>'<p>'+esc(t.merchant)+' · '+(t.kind==='refund'?'Hoàn tiền ':'')+cash(t.amount)+'</p>').join('')+'</details>').join('')+'<p class="note">Đã loại chuyển khoản nội bộ và trừ hoàn tiền. Bổ sung giao dịch ngoài MoMo nếu có.</p><div class="actions"><button onclick="go(\'goal\')">Tạo mục tiêu →</button><button class="secondary" onclick="go(\'demo\')">Bổ sung dữ liệu</button></div></div>'}}
if(page==='consent'){h=header('Bạn kiểm soát dữ liệu','Chỉ dùng dữ liệu mô phỏng trên thiết bị này.')+'<div class="card"><h2>Cho phép lập kế hoạch</h2><p>GoalWise sử dụng lịch sử giao dịch, thu nhập, chi tiêu và số tiền dành cho mục tiêu. Vị trí chỉ là thông tin tùy chọn. Không kết nối tài khoản thật.</p><label><input id="allow" type="checkbox"> Tôi đồng ý sử dụng dữ liệu demo để lập kế hoạch.</label><div class="actions"><button onclick="if(document.getElementById(\'allow\').checked){s.consent=true;save();go(\'home\')}else alert(\'Vui lòng xác nhận trước khi tiếp tục.\')">Tiếp tục</button><button class="secondary" onclick="go(\'home\')">Từ chối</button></div></div>'}
if(page==='goal'){h=header('Bạn đang tiết kiệm cho điều gì?','')+'<div class="card">'+field('Tên mục tiêu','name','text')+'<div class="grid">'+field('Giá hiện tại (₫)','price')+field('Tiền đã dành riêng (₫)','saved')+field('Thời hạn (tháng, 1–120)','months')+field('Lạm phát giả định %/năm (0 = giá cố định)','inflation')+field('Dự phòng mỗi tháng (₫)','reserve')+field('Trả nợ mỗi tháng (₫)','debt')+'</div><button class="secondary" onclick="document.getElementById(\'inflation\').value=4.57">Thử kịch bản CPI 4,57%</button><small> CPI lịch sử, không phải dự báo.</small></div><div class="card"><h2>Hoàn cảnh của bạn</h2>'+select('Thành phố (tùy chọn)','city',[['HCM','TP.HCM'],['HN','Hà Nội'],['other','Khác / không cung cấp']])+select('Khu vực','area',[['urban','Thành thị'],['suburban','Ngoại thành'],['rural','Nông thôn'],['unknown','Không cung cấp']])+select('Nhà ở','housing',[['rent','Thuê nhà'],['family','Ở cùng gia đình'],['own','Nhà riêng'],['unknown','Không cung cấp']])+'<button onclick="setGoal()">Tiếp tục tối ưu ngân sách</button></div>'}
if(page==='plan'){if(!s.consent){h=locked()}else if(!s.draft){h=header('Tối ưu ngân sách','')+'<div class="card">'+metric('Cần tiết kiệm mỗi tháng',cash(q.required))+metric('Thiếu mỗi tháng',cash(q.shortfall),'red')+'<details><summary>Tham chiếu chi phí sinh hoạt</summary>'+contextHtml()+'</details><h3>Mức chi tối thiểu</h3><button class="secondary" onclick="suggestFloors()">✦ AI gợi ý mức chi</button><p id="aiFloorNote" class="note"></p>'+optional.map(k=>'<label class="field"><span>'+C.find(c=>c[0]===k)[1]+' · Lịch sử: '+history(k).map(cash).join(' / ')+'</span><input type="number" min="0" id="floor_'+k+'" oninput="resetFloorConfirmation()" step="1" value="'+s.floors[k]+'"></label>').join('')+'<label><input id="confirmFloor" type="checkbox" onchange="syncFloorConfirmation()" '+(s.confirmed?'checked':'')+'> Tôi xác nhận có thể duy trì các mức chi này.</label><p id="floorNotice" class="note" role="status">'+(s.confirmed?'':'Xác nhận để tiếp tục.')+'</p><div class="actions"><button id="generatePlan" onclick="generate()" '+(!s.confirmed?'disabled':'')+'>Tạo đề xuất</button><button class="secondary" onclick="go(\'goal\')">Sửa mục tiêu</button></div>'+sourceHtml()+'</div>'}else{const e=evaluate(s.draft);h=header('Kế hoạch chi tiêu của bạn','Chưa áp dụng')+'<div class="card"><strong>'+esc(s.aiOrigin||'Quy tắc offline')+'</strong><p class="note">'+esc(s.aiReason||'')+'</p></div>'+'<div class="hero"><small>'+esc(q.g.name)+'</small><div class="progress">'+cash(Math.abs(e.after))+'</div><p>'+(e.after<0?'Thâm hụt dự kiến mỗi tháng':'Tiết kiệm dự kiến mỗi tháng')+' · cần góp '+cash(q.required)+'</p>'+bar(q.required?100*e.after/q.required:100,'#fff')+'<small>Giá mục tiêu: '+cash(q.future)+' · Thời hạn: '+q.g.months+' tháng</small></div><div class="card">'+(e.feasible?'<div class="good">Đúng tiến độ dự kiến.</div>':('<div class="warn"><strong>Chưa đủ tiền để đạt mục tiêu đúng hạn</strong><p>Còn thiếu '+cash(Math.max(0,q.required-e.after))+'/tháng. Giữ nguyên khoản đã khóa.</p>'+( function locked(){return header('Cần xác nhận dữ liệu','Bắt đầu bằng quyền truy cập mô phỏng.')+'<button onclick="go(\'consent\')">Tiếp tục</button>'}
function val(id){return document.getElementById(id).value}
function setGoal(){let g={name:val('name').trim()||'Mục tiêu của tôi',price:num(val('price')),saved:num(val('saved')),months:Math.min(120,Math.max(1,Math.floor(num(val('months'))))),inflation:Math.min(30,num(val('inflation'))),reserve:num(val('reserve')),debt:num(val('debt')),city:val('city'),area:val('area'),housing:val('housing')};if(!g.price){alert('Nhập giá mục tiêu lớn hơn 0.');return}s.goal=g;invalidate();go('plan')}
function readFloors(){const values={};for(const k of optional){const el=document.getElementById('floor_'+k);if(!el||el.value.trim()===''||!Number.isFinite(Number(el.value))||Number(el.value)<0||!Number.isInteger(Number(el.value)))return null;if(Number(el.value)>stats(2).cats[k])return null;values[k]=Number(el.value);}return values}
function syncFloorConfirmation(){const cb=document.getElementById('confirmFloor'),btn=document.getElementById('generatePlan'),note=document.getElementById('floorNotice');if(!cb||!btn||!note)return;const values=readFloors();btn.disabled=!cb.checked||!values;note.textContent=!values?'Ngưỡng phải từ 0 đến mức chi hiện tại.':cb.checked?'':'Xác nhận để tiếp tục.';}
function reviseFloors(){s.draft=null;s.confirmed=false;save();render();} 
function resetFloorConfirmation(){document.getElementById('confirmFloor').checked=false;s.confirmed=false;const values=readFloors();if(values)s.floors={...values};save();syncFloorConfirmation();}
async function generate(){const values=readFloors();if(!document.getElementById('confirmFloor').checked||!values){syncFloorConfirmation();return;}s.floors=values;s.confirmed=true;await aiOptimize();render();window.scrollTo(0,0)}
function editBudget(k,v){let x=stats(2).cats[k];s.draft[k]=Math.min(x,Math.max(floor(k,x),num(v)));save();render()}
async function lock(k,v){if(!s.confirmed||!s.draft||!optional.includes(k))return;s.locks[k]=!!v;await aiOptimize();render()}
async function regenerateBudget(){if(!s.confirmed||!s.draft)return;await aiOptimize();render()}
function alternativeMonths(capacity){const g=s.goal;if(capacity<=0)return null;for(let m=g.months+1;m<=120;m++){const future=Math.ceil(g.price*Math.pow(1+g.inflation/100,m/12));if(Math.ceil(Math.max(0,future-g.saved)/m)<=capacity)return m}return null}
async function extendGoal(){if(!s.confirmed||!s.draft)return;const e=evaluate(s.draft),m=alternativeMonths(e.after);if(e.feasible||m===null)return;if(!confirm('Đổi thời hạn từ '+s.goal.months+' thành '+m+' tháng? Các khoản đã khóa và ngưỡng chi tối thiểu vẫn được giữ nguyên.'))return;s.goal={...s.goal,months:m};s.approved=null;s.monitor=false;s.alerts=[];s.actual={};await aiOptimize();render()}
function approve(){if(aiBusy)return;if(!s.confirmed||!s.draft)return;let e=evaluate(s.draft);if(!s.consent)return;const recovery=!e.feasible;if(recovery&&!confirm('Áp dụng kế hoạch cân đối dòng tiền? Mục tiêu tiết kiệm chưa khả thi; chưa đề xuất gửi ngân hàng.'))return;for(const [k] of C)if(s.draft[k]<floor(k,e.x.cats[k])||s.draft[k]>e.x.cats[k])return;const version=(s.approved?.version||0)+1;s.approved={...s.goal,version,approvedAt:new Date().toISOString(),budget:{...s.draft},required:e.required,future:e.future,income:e.x.income,recovery};s.actual=Object.fromEntries(C.map(([k])=>[k,k==='shopping'?Math.min(550000,s.draft[k]):Math.floor(s.draft[k]*.35)]));s.alerts=[];s.monitor=false;save();go('monitor')}
function rebalance(){if(!s.approved||!s.monitor)return;let a=s.approved,b={...a.budget};let need=0;for(const [k] of C){let excess=Math.max(0,(s.actual[k]||0)-b[k]);b[k]+=excess;need+=excess}if(!need){alert('Chưa có khoản vượt cần điều chuyển.');return}let original=need;for(const k of ['subscriptions','fun','shopping']){if(s.locks[k])continue;let room=Math.max(0,b[k]-Math.max(s.actual[k]||0,floor(k,stats(2).cats[k])));let cut=Math.min(room,need);b[k]-=cut;need-=cut}if(need){alert('Không đủ ngân sách linh hoạt để bù '+cash(need)+'. Hãy xem lại thời hạn hoặc mục tiêu.');return}let changes=C.filter(([k])=>b[k]!==a.budget[k]).map(([k,l])=>l+': '+cash(a.budget[k])+' → '+cash(b[k])).join('\\n');if(confirm('Xác nhận điều chuyển '+cash(original)+'?\\n'+changes)){s.approved={...a,budget:b,version:a.version+1,approvedAt:new Date().toISOString()};save();render()}}
function forecastSavings(){let a=s.approved;return a.income-a.debt-a.reserve-sum(C.map(([k])=>Math.max(a.budget[k],s.actual[k]||0)))}
function addActual(){recordSpend(val('simcat'),num(val('simamount')))}
function quickSpend(amount){recordSpend('shopping',amount)}
function recordSpend(k,amount){if(!s.approved||!s.monitor||!amount||!C.some(c=>c[0]===k))return;let b=s.approved.budget[k],old=s.actual[k]||0,now=old+amount;s.actual[k]=now;let level=v=>v>b?3:b>0&&v/b*100>=s.threshold?2:b>0&&v/b*100>=75?1:0;let newLevel=level(now),notice=null;if(newLevel>level(old)){let short=Math.max(0,s.approved.required-forecastSavings()),label=C.find(c=>c[0]===k)[1];notice={title:label+(newLevel===3?' vượt ngân sách':newLevel===2?' sắp vượt ngân sách':' đã dùng phần lớn ngân sách'),text:'Giao dịch mới: '+cash(amount)+'. Đã chi '+cash(now)+' / '+cash(b)+'. '+(newLevel===3?'Vượt '+cash(now-b)+'. ':'Còn '+cash(Math.max(0,b-now))+'. ')+(s.approved.recovery?'Đang theo dõi cân đối dòng tiền; chưa kích hoạt mục tiêu tiết kiệm.':short?'Nếu giữ các ngân sách còn lại, dự kiến thiếu '+cash(short)+' cho mục tiêu.':'Tổng dự báo vẫn đủ mục tiêu.'),level:newLevel,read:false,time:new Date().toISOString()};s.alerts.unshift(notice)}save();render();if(notice)showNotice(notice);else showReceipt(amount,k);assessSpend(k,amount,notice)}
function updateBell(){let el=document.getElementById('gwCount');if(!el)return;let count=s.alerts.filter(a=>!a.read).length;el.hidden=!count;el.textContent=count}
function closeNotice(){document.getElementById('gwNotice').hidden=true}

function saveReview(){if(!s.consent)return;const values={};for(const k of ['income',...C.map(c=>c[0])]){const raw=val('review_'+k),v=Number(raw);if(raw.trim()===''||!Number.isSafeInteger(v)||v<0){alert('Nhập số tiền hợp lệ, không âm.');return;}values[k]=v;}if(!confirm('Xác nhận đây là dữ liệu thu chi tháng mô phỏng đã rà soát?'))return;s.tx=s.tx.filter(t=>t.m!==2||!['income','expense','refund'].includes(t.kind));s.tx.push({m:2,cat:'income',kind:'income',amount:values.income,merchant:'Thu nhập đã rà soát'});for(const [k,l] of C)if(values[k])s.tx.push({m:2,cat:k,kind:'expense',amount:values[k],merchant:l+' · dữ liệu đã rà soát'});for(const k of optional)s.floors[k]=Math.min(num(s.floors[k]),values[k]);s.confirmed=false;invalidate();go('plan')}

.getElementById(id),fmt=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(n||0))+'đ';\nconst short=n=>Math.abs(n)>=1e6?new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(n/1e6)+' triệu':fmt(n);\nconst pct=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(n)+'%';\nconst ctx=__BRIDGE_CONTEXT__, plan=ctx.plan;\nlet db=JSON.parse($('embeddedRates').textContent),applied=true,depositManual=false,options=null,selectedBankId='';\nconst n=id=>{let v=Number($(id).value);return Number.isFinite(v)&&v>=0?v:0};\nconst saving=()=>plan.required, surplus=()=>plan.income-plan.reserve-plan.debt-Object.values(plan.budget).reduce((a,b)=>a+b,0);\nconst escapeHtml=v=>String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction bankContext(){let month=n('depositMonth'),available=month===0?plan.saved:plan.saved+ctx.first+Math.max(0,month-1)*plan.required;return {month,available,until:Math.max(0,plan.months-month),principal:n('principal'),monthly:plan.required}}\nfunction syncDeposit(){const c=bankContext();$('principal').value=Math.floor(c.available);$('principal').max=c.available;renderCompare()}\nfunction populateBanks(){const select=$('ownBank'),prior=select.value;select.innerHTML='<option value=\"\">Không chọn ngân hàng</option>';for(const b of db.banks){const o=document.createElement('option');o.value=b.id;o.textContent=b.name;select.add(o)}for(const name of db.extra_bank_names||[]){const o=document.createElement('option');o.value='extra:'+name;o.textContent=name;select.add(o)}select.add(new Option('Ngân hàng khác (nhập tên)','custom'));if(prior&&[...select.options].some(x=>x.value===prior))select.value=prior}\nfunction ownBankName(){let v=$('ownBank').value;if(v==='custom')return $('ownBankOther').value.trim();if(v.startsWith('extra:'))return v.slice(6);return db.banks.find(x=>x.id===v)?.name||''}\nfunction updateOwnBank(){selectedBankId='';const custom=$('ownBank').value==='custom';$('ownBankOtherWrap').hidden=!custom;renderCompare()}\nfunction candidates(principal,until){\n  if(principal<=0||until<1)return [];\n  const pool=[];\n  for(const bank of db.banks){\n    // The default recommendations require an amount-qualified MoMo partner.\n    if(!bank.partner||bank.minimum==null||principal<bank.minimum)continue;\n    for(const [t,rate] of Object.entries(bank.rates||{})){\n      const term=Number(t);\n      if(term<1||term>until||term>24||!Number.isFinite(rate))continue;\n      pool.push({b:bank,term,rate,interest:principal*rate/100*term/12,referenceOnly:false});\n    }\n  }\n  return pool;\n}\nfunction ownCandidates(principal,until){\n  const name=ownBankName(),raw=$('ownBank').value;\n  if(!name||principal<=0||until<1)return [];\n  const bank=db.banks.find(b=>b.id===raw)||db.banks.find(b=>b.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'));\n  if(!bank)return [];\n  // Non-partner minimums are missing in MoMo's comparison: display as *reference only*.\n  if(bank.partner&&bank.minimum!=null&&principal<bank.minimum)return [];\n  const pool=[];\n  for(const [t,rate] of Object.entries(bank.rates||{})){\n    const term=Number(t);\n    if(term<1||term>until||term>24||!Number.isFinite(rate))continue;\n    pool.push({b:bank,term,rate,interest:principal*rate/100*term/12,referenceOnly:!bank.partner||bank.minimum==null});\n  }\n  return pool;\n}\nfunction pickOptions(pool,owned){\n  const preference=$('priority').value;\n  const maxInterest=(items)=>[...items].sort((a,b)=>b.interest-a.interest||b.rate-a.rate||a.term-b.term)[0]||null;\n  const shortest=(items)=>[...items].sort((a,b)=>a.term-b.term||b.rate-a.rate)[0]||null;\n  if(preference==='same'){\n    if(!owned.length)return {high:null,flex:null,reason:'same_unavailable'};\n    const high=maxInterest(owned),flex=shortest(owned.filter(x=>x.term!==high.term));\n    return {high,flex,reason:'same'};\n  }\n  const high=maxInterest(pool);\n  if(!high)return {high:null,flex:null,reason:'no_partner'};\n  const alternatives=pool.filter(x=>!(x.b.id===high.b.id&&x.term===high.term));\n  const otherBank=alternatives.filter(x=>x.b.id!==high.b.id);\n  let flex=null,reason='general';\n  if(preference==='balanced'&&owned.length){\n    flex=shortest(owned.filter(x=>!(x.b.id===high.b.id&&x.term===high.term)))||maxInterest(owned.filter(x=>!(x.b.id===high.b.id&&x.term===high.term)));\n    reason=flex?'owned_comparison':'general';\n  }\n  if(preference==='liquid'){\n    const bestTerm=Math.min(...alternatives.map(x=>x.term));\n    const shortPool=alternatives.filter(x=>x.term===bestTerm);\n    flex=shortPool.find(x=>owned.some(o=>o.b.id===x.b.id&&o.term===x.term))||maxInterest(shortPool);\n    // A known bank at an equally short tenor is more convenient if not already option A.\n    if(owned.length){\n      const ownShort=shortest(owned.filter(x=>!(x.b.id===high.b.id&&x.term===high.term)));\n      if(ownShort&&(!flex||ownShort.term<=flex.term))flex=ownShort;\n    }\n    reason='liquid';\n  }\n  if(!flex&&preference==='rate'){\n    flex=maxInterest(otherBank)||maxInterest(alternatives);\n    reason='rate';\n  }\n  if(!flex)flex=shortest(otherBank)||shortest(alternatives);\n  return {high,flex,reason};\n}\nfunction makeCard(x,type,principal,selectionReason){\n  if(!x){const box=document.createElement('div');box.className='empty';box.textContent='Không có phương án thứ hai đáp ứng tiêu chí bạn chọn. Bạn có thể đổi mức ưu tiên để xem thêm.';return box}\n  const b=x.b,card=document.createElement('article');card.className='bankcard '+(type==='A'?'best':'flexible');\n  const own=ownBankName().toLocaleLowerCase('vi')===b.name.toLocaleLowerCase('vi');\n  const ref=x.referenceOnly;\n  const caption=selectionReason==='same'?(type==='A'?'A · Lãi cao tại ngân hàng đang dùng':'B · Kỳ hạn ngắn tại cùng ngân hàng'):(type==='A'?'A · Lãi dự kiến cao':'B · '+(selectionReason==='rate'?'Lãi cao kế tiếp':own?'Ngân hàng đang dùng':type==='B'&&options?.high&&x.term>=options.high.term?'Phương án thay thế':'Linh hoạt hơn'));\n  const access=b.partner?'Đối tác theo bảng lưu':'Ngân hàng khác · chỉ có lãi tham khảo';\n  const threshold=b.minimum==null?'Chưa xác minh':fmt(b.minimum)+(b.min_verified?'':' (tham khảo)');\n  const eligibility=ref?'Cần kiểm tra mức gửi tối thiểu, điều kiện mở sổ và mức lãi thực tế trước khi chọn.':b.min_verified?'Số tiền dự kiến đáp ứng mức gửi tối thiểu được xác nhận.':'Mức gửi tối thiểu trong bảng là tham khảo; cần xác minh tại thời điểm mở sổ.';\n  card.innerHTML=`<span class=\"badge ${type==='A'?'':'green'}\">${escapeHtml(caption)}</span><div class=\"bankname\" style=\"margin-top:11px\">${escapeHtml(b.name)}</div><div class=\"note\">${own?'✓ Ngân hàng bạn đang dùng · ':''}${escapeHtml(access)} · ${x.term} tháng</div><div class=\"big\">${pct(x.rate)}<span style=\"font-size:12px;color:#8b818a;font-weight:600\"> /năm</span></div><div class=\"meta\"><div><small>Gửi dự kiến</small><strong>${fmt(principal)}</strong></div><div><small>Lãi đến hạn</small><strong>${fmt(x.interest)}</strong></div><div><small>Nhận khi đáo hạn</small><strong>${fmt(principal+x.interest)}</strong></div><div><small>Gửi tối thiểu</small><strong>${escapeHtml(threshold)}</strong></div></div><div class=\"whybank\">${ref?'ⓘ Chỉ để đối chiếu, chưa đủ thông tin để xác nhận mở sổ.':selectionReason==='same'?'So sánh hai kỳ hạn tại ngân hàng bạn đang có, không bắt buộc mở thêm tài khoản.':type==='A'?'Lãi dự kiến cao nếu giữ đủ kỳ hạn.':selectionReason==='rate'?'Phương án lãi cao kế tiếp theo ưu tiên đã chọn.':options?.high&&x.term<options.high.term?'Kỳ hạn ngắn hơn; tiền rút trước hạn vẫn có thể bị giảm lãi.':'Phương án thay thế theo ưu tiên; kiểm tra kỳ hạn và điều kiện rút.'}</div><div class=\"note\" style=\"margin-top:10px\">${eligibility}</div><a href=\"${escapeHtml(db.source_url)}\" target=\"_blank\" rel=\"noopener noreferrer\">Xem nguồn lãi suất ↗</a>`;\n  return card;\n}\nfunction renderCompare(){\n  const c=bankContext();$('bankMonthly').textContent=fmt(c.monthly);$('bankSaved').textContent=fmt(plan.saved);\n  $('rateMessage').textContent=`Bảng tham khảo MoMo (chưa xác minh lại): ${db.as_of.split('-').reverse().join('/')}. ${c.month===0?'Tiền hiện có':'Tiền dự kiến sau '+c.month+' tháng'}: ${fmt(c.available)}.`;\n  const host=$('bestCards');host.replaceChildren();options=null;\n  const owned=ownCandidates(c.principal,c.until);const savedName=ownBankName();const priority=$('priority').value;\n  let status='';\n  if(!applied)status='Áp dụng ngân sách ở Bước 1 trước khi so sánh.';\n  else if(surplus('proposed')<0)status='Thu nhập chưa đủ các khoản chi và dự phòng.';\n  else if(c.principal<=0)status='Chưa có tiền để gửi. Hãy điều chỉnh ngân sách trước.';\n  else if(c.principal>c.available)status='Số tiền muốn gửi vượt số tiền dự kiến có thể tích lũy.';\n  else if(c.until<1)status='Đã đến thời điểm cần dùng tiền. Không nên khóa tiền trong sổ có kỳ hạn.';\n  else if(priority==='same'&&!savedName)status='Chọn ngân hàng đang dùng để chỉ xem phương án tại ngân hàng đó.';\n  if(status){host.innerHTML='<div class=\"empty\" style=\"grid-column:1/-1\">'+escapeHtml(status)+'</div>';$('eligible').textContent='Chưa có gợi ý';}\n  else{\n    const partnerPool=candidates(c.principal,c.until),result=pickOptions(partnerPool,owned);\n    $('eligible').textContent=(partnerPool.length+owned.filter(x=>x.referenceOnly).length)+' kỳ hạn có dữ liệu';\n    if(!result.high){\n      let message='Không có phương án đủ dữ liệu để so sánh.';\n      if(priority==='same')message=`${savedName}: chưa có bảng lãi phù hợp hoặc chưa đủ mức gửi tối thiểu trong dữ liệu. Thử chọn ưu tiên khác để xem ngân hàng đối tác.`;\n      else message='Không tìm thấy ngân hàng đối tác đủ mức gửi tối thiểu và kỳ hạn.';\n      host.innerHTML='<div class=\"empty\" style=\"grid-column:1/-1\">'+escapeHtml(message)+'</div>';\n    }else{\n      options={...result,principal:c.principal,until:c.until};host.append(makeCard(result.high,'A',c.principal,result.reason));host.append(makeCard(result.flex,'B',c.principal,result.reason));\n      \n    }\n  }\n  const ownMissing=savedName&&!owned.length;\n  $('matchingScope').textContent=priority==='same'?`Đang ưu tiên ngân hàng bạn sử dụng: ${savedName||'chưa chọn'}. Các mức lãi từ bảng MoMo chỉ mang tính tham khảo.`:\n     `Gợi ý A lấy từ ngân hàng đối tác đủ vốn tham khảo; B ưu tiên ${priority==='liquid'?'kỳ hạn ngắn':priority==='balanced'?'ngân hàng bạn đang dùng nếu có dữ liệu':'mức lãi cao kế tiếp'}. ${ownMissing?`Chưa có đủ dữ liệu để đưa ${savedName} vào gợi ý.`:''}`;\n  renderBankList();renderWithdrawal();\n}\nfunction renderBankList(){const term=n('allTerm'),sort=$('sortRates').value,p=$('principal').value?Number($('principal').value):0;const list=[...db.banks];list.sort((a,b)=>sort==='partner'?Number(b.partner)-Number(a.partner)||b.rates[term]-a.rates[term]:sort==='name'?a.name.localeCompare(b.name,'vi'):b.rates[term]-a.rates[term]);const host=$('bankList');host.replaceChildren();for(const b of list){const row=document.createElement('button');row.type='button';row.className='bankmini';row.style.width='100%';row.style.textAlign='left';row.style.background='transparent';row.style.borderTop='0';row.style.borderLeft='0';row.style.borderRight='0';row.style.cursor='pointer';row.innerHTML=`<span class=\"name\">${escapeHtml(b.name)}<small class=\"note\" style=\"display:block\">${b.partner?'Đối tác theo bảng lưu':'Ngân hàng khác'}</small></span><span class=\"rate-tag\">${pct(b.rates[term])}</span><span class=\"note\">${b.minimum==null?'Chưa rõ tối thiểu':p>=b.minimum?'Đủ vốn (tham khảo)':'Từ '+short(b.minimum)}</span><span class=\"note\">Xem chi tiết →</span>`;row.addEventListener('click',()=>{selectedBankId=b.id;showSelectedBank()});host.append(row)}$('dbSize').textContent=db.banks.length+' ngân hàng';showSelectedBank()}\nfunction showSelectedBank(){const id=selectedBankId||$('ownBank').value;const bank=db.banks.find(x=>x.id===id);const area=$('selectedBank');if(!bank){const name=ownBankName();area.textContent=name?`${name}: chưa có lãi suất đối chiếu trong database. App không tự tạo số; hãy kiểm tra biểu ngân hàng trước khi quyết định.`:'Chọn một ngân hàng ở bảng trên để xem chi tiết.';return}const t=n('allTerm'),rate=bank.rates[t],p=n('principal');area.replaceChildren();const title=document.createElement('strong');title.textContent=bank.name+' · '+t+' tháng · '+pct(rate)+'/năm';area.append(title);const detail=document.createElement('div');detail.textContent=`Lãi minh họa cho ${fmt(p)}: ${fmt(p*rate/100*t/12)}. ${bank.minimum==null?'Mức gửi tối thiểu chưa được xác minh.':'Mức gửi tham khảo: '+fmt(bank.minimum)+'.'} ${bank.partner?'Kiểm tra lại khả năng mở sổ qua MoMo.':'Không được ghi là đối tác trong bảng lưu.'}`;area.append(detail);const anchor=document.createElement('a');anchor.href=db.source_url;anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.textContent='Nguồn công bố lãi suất ↗';area.append(anchor)}\nfunction renderWithdrawal(){const host=$('withdrawResult');if(!options){host.textContent='Chọn được phương án ở trên để mô phỏng rút trước hạn.';return}const month=n('withdrawMonth'),want=n('withdrawAmount'),p=options.principal;let out=[];if(want>p){host.textContent='Số tiền rút không được vượt vốn gửi.';return}for(const [name,x] of [['A',options.high],['B',options.flex]]){if(!x)continue;if(month>=x.term){out.push(`Option ${name} — ${x.b.name}: đã đáo hạn ở tháng ${x.term}, nhận lãi minh họa ${fmt(x.interest)} (không tính tái tục).`);continue}const zero= p*0.001*month/12;let s=`Option ${name} — ${x.b.name}: nếu rút hết tháng ${month}, lãi chỉ khoảng ${fmt(zero)} theo giả định không kỳ hạn 0,1%/năm.`;\nif(want>0&&want<p&&x.b.partial){if(p-want>=x.b.min_remainder){s+=` Nếu rút ${fmt(want)} riêng, lãi phần rút sớm khoảng ${fmt(want*.001*month/12)}; phần ${fmt(p-want)} còn lại có thể tiếp tục hưởng lãi kỳ hạn khoảng ${fmt((p-want)*x.rate/100*x.term/12)} nếu đủ điều kiện và giữ đến hạn.`}else s+=` Rút một phần như nhập sẽ không đủ số dư duy trì tham khảo.`}out.push(s)}host.textContent=out.join('\\n\\n')+'\\n\\n0,1%/năm chỉ là giả định minh họa, không phải mức rút sớm thực tế của ngân hàng.'}\n\nlet bankRun=0;\nasync function aiBank(){\n if(!options)return;const token=++bankRun,c=bankContext(),priority=$('priority').value,own=$('ownBank').value;\n const key=x=>x.b.id+':'+x.term;\n const pool=[...new Map([...candidates(c.principal,c.until),...ownCandidates(c.principal,c.until)].map(x=>[key(x),x])).values()].filter(x=>key(x)!==key(options.high)&&(priority!=='same'||x.b.id===options.high.b.id)&&(priority!=='liquid'||x.term<=options.high.term));\n if(!pool.length)return; const a=options.high, stamp=JSON.stringify([c,priority,own,ownBankName()]);\n const note=$('matchingScope');note.textContent='Đang đánh giá lựa chọn theo ưu tiên…';\n try{const data=await parent.askAI('bank',{priority,own_bank:ownBankName(),principal:c.principal,months:c.until,goal_months:plan.months,first_month_savings:ctx.first,monthly:plan.required,option_a:{id:key(a),term:a.term,interest:a.interest},candidates:pool.map(x=>({id:key(x),name:x.b.name,term:x.term,interest:Math.round(x.interest),rate:x.rate,reference_only:x.referenceOnly,partial:x.b.partial}))});\n if(token!==bankRun||stamp!==JSON.stringify([bankContext(),$('priority').value,$('ownBank').value,ownBankName()]))return;\n const b=pool.find(x=>key(x)===data.choice);if(!b)throw Error('Lựa chọn ngoài danh mục');\n options={...options,flex:b};const card=makeCard(b,'B',c.principal,priority==='same'?'same':'general');card.querySelector('.whybank').textContent=String(data.reason||'').slice(0,250);card.querySelector('.badge').textContent='B · AI cá nhân hóa';$('bestCards').replaceChildren(makeCard(a,'A',c.principal,priority==='same'?'same':'general'),card);note.textContent='Gemini AI · B được AI chọn từ danh sách đã lọc; điều kiện và lãi suất vẫn là dữ liệu tham khảo.';renderWithdrawal();\n }catch(e){if(token===bankRun&&stamp===JSON.stringify([bankContext(),$('priority').value,$('ownBank').value,ownBankName()]))note.textContent='So sánh theo quy tắc · '+String(e.message).slice(0,160);}\n}\n\n$('depositMonth').replaceChildren();for(let i=0;i<=plan.months;i++)$('depositMonth').add(new Option(i===0?'Ngay bây giờ':'Sau '+i+' tháng (dự kiến)',i));$('depositMonth').value='0';\n\n$('dataDate').textContent='Snapshot '+db.as_of.split('-').reverse().join('/')+' · '+db.banks.length+' ngân hàng · chưa xác minh lại';$('rateSource').href=db.source_url;\n$('depositMonth').onchange=syncDeposit;$('principal').oninput=renderCompare;$('priority').onchange=renderCompare;$('ownBank').onchange=updateOwnBank;$('ownBankOther').oninput=()=>{selectedBankId='';renderCompare()};$('compare').onclick=async()=>{renderCompare();await aiBank();};$('refresh').onclick=()=>window.open(db.source_url,'_blank','noopener');$('back').onclick=()=>parent.go('saving');\n['allTerm','sortRates'].forEach(id=>$(id).onchange=renderBankList);['withdrawMonth','withdrawAmount'].forEach(id=>$(id).oninput=renderWithdrawal);\npopulateBanks();syncDeposit();new ResizeObserver(()=>{const f=parent.document.getElementById('v8frame');if(f)f.style.height=(document.body.scrollHeight+20)+'px'}).observe(document.body);\n<\/script></body></html>";
function initV8(){const a=s.approved;const data={plan:a,first:Math.min(a.required,Math.max(0,forecastSavings()))};document.getElementById('v8frame').srcdoc=v8Template.replace('__BRIDGE_CONTEXT__',()=>JSON.stringify(data).replace(/</g,'\\u003c'));}


let aiBusy=false, aiOnline=false, aiModel='';
async function checkAI(){if(location.protocol==='file:')return;try{const r=await fetch('/api/health');const x=await r.json();aiOnline=!!x.ready;aiModel=x.model||'';document.getElementById('aiStatus').textContent=aiOnline?'Gemini AI · có cấu hình':'Offline · chưa cấu hình Gemini API';}catch{}}
async function askAI(task,payload){if(!aiOnline)throw Error('Chưa kết nối Gemini AI');if(!s.consent)throw Error('Chưa đồng ý dữ liệu');if(!sessionStorage.getItem('gwGeminiConsent')){if(!confirm('Cho phép gửi dữ liệu tài chính mô phỏng, không có thông tin định danh, tới Gemini AI để tạo đề xuất?'))throw Error('Chưa cấp quyền AI');sessionStorage.setItem('gwGeminiConsent','1');}const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,payload})});const d=await r.json();if(!r.ok)throw Error(d.error||'API lỗi');return d.result;}
function aiInput(){const q=calculation();return {goal:{price:q.future,months:q.g.months,existing:q.g.saved,city:q.g.city,area:q.g.area,housing:q.g.housing,inflation:q.g.inflation},income:q.x.income,debt:q.g.debt,reserve:q.g.reserve,required:q.required,shortfall:q.shortfall,categories:C.map(([id,name])=>({id,name,current:q.x.cats[id],history:history(id),protected:!optional.includes(id),locked:!!s.locks[id],floor:floor(id,q.x.cats[id])}))}}
function setBusy(v){aiBusy=v;const root=document.getElementById('app');root.inert=v;document.getElementById('aiStatus').textContent=v?'Gemini AI · đang phân tích…':aiOnline?'Gemini AI · có cấu hình':'Offline · quy tắc';}
async function suggestFloors(){const note=document.getElementById('aiFloorNote');if(!aiOnline){note.textContent='Mở bản server và cấu hình Gemini AI để dùng gợi ý AI.';return;}setBusy(true);try{const d=await askAI('floors',aiInput());for(const k of optional){const v=d.floors?.[k],x=stats(2).cats[k];if(!Number.isInteger(v)||v<0||v>x)throw Error('Ngưỡng AI không hợp lệ');}for(const k of optional)document.getElementById('floor_'+k).value=d.floors[k];resetFloorConfirmation();note.textContent='Gemini AI · '+String(d.reason||'').slice(0,250)+' Kiểm tra và xác nhận trước khi áp dụng.';}catch(e){note.textContent='Không dùng được AI: '+e.message;}finally{setBusy(false)}}
function validateAIPlan(d,input){const b=d.budget;if(!b||typeof b!=='object')throw Error('Thiếu ngân sách');let totalCut=0,maxCut=0;for(const c of input.categories){let v=b[c.id];if(!Number.isInteger(v)||v<c.floor||v>c.current||(c.protected||c.locked)&&v!==c.current)throw Error('Vi phạm giới hạn '+c.id);totalCut+=c.current-v;maxCut+=c.current-c.floor;}const target=Math.min(input.shortfall,maxCut);if(totalCut!==target)throw Error('Mức giảm chưa khớp mục tiêu: '+totalCut+' / '+target);return Object.fromEntries(input.categories.map(c=>[c.id,b[c.id]]));}
async function aiOptimize(){if(!aiOnline){optimize();return;}setBusy(true);try{const input=aiInput();const maxCut=input.categories.reduce((a,c)=>a+c.current-c.floor,0);input.target_cut=Math.min(input.shortfall,maxCut);const d=await askAI('budget',input);s.draft=validateAIPlan(d,input);s.aiOrigin='Gemini AI · đề xuất đã kiểm tra';s.aiReason=String(d.reason||'').slice(0,300);s.aiReasons=Object.fromEntries(optional.map(k=>[k,String(d.reasons?.[k]||'').slice(0,200)]));save();}catch(e){optimize();s.aiOrigin='Quy tắc dự phòng';s.aiReason='AI chưa trả về kế hoạch hợp lệ: '+e.message;save();}finally{setBusy(false)}}
let spendRun=0;
async function assessSpend(k,amount,notice){if(!aiOnline||!s.monitor||!s.approved||!sessionStorage.getItem('gwGeminiConsent'))return;const seq=++spendRun,a=s.approved;try{const d=await askAI('alert',{category:k,amount,budget:a.budget,actual:s.actual,required:a.required,forecast:forecastSavings(),history:history(k),floor:s.floors});if(seq!==spendRun||s.approved!==a||!s.monitor)return;if(d.risk===true||notice){const text=String(d.reason||'').slice(0,250);if(!text)return;if(notice){notice.text+=' · AI: '+text;save();render();showNotice(notice);}else{const n={title:'AI · Lưu ý chi tiêu',text,level:2,read:false,time:new Date().toISOString()};s.alerts.unshift(n);save();render();showNotice(n);}}}catch{}}


// The export deliberately excludes bank names, comparisons, rates and account data.
function exportBudgetPDF(){
 const report=document.getElementById('printReport');report.replaceChildren();
 const x=stats(2),g=s.goal,plan=s.approved?.budget||s.draft||x.cats;
 function add(tag,text){const el=document.createElement(tag);el.textContent=text;report.appendChild(el);return el}
 function table(headers,rows){const t=document.createElement('table'),head=t.createTHead().insertRow();
  for(const title of headers){const th=document.createElement('th');th.textContent=title;head.appendChild(th)}
  const body=t.createTBody();for(const cells of rows){const r=body.insertRow();for(const v of cells)r.insertCell().textContent=v}
  report.appendChild(t)}
 const numV=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(v||0))+' ₫';
 add('h1','GoalWise | Báo cáo thu – chi');
 add('p','Ngày tạo: '+new Date().toLocaleDateString('vi-VN')+' · Khu vực: '+(g.city||'Chưa chọn'));
 add('h2','Ngân sách tháng');
 const current=x.expenses,proposed=Object.values(plan).reduce((a,b)=>a+(Number(b)||0),0);
 table(['Chỉ tiêu','Giá trị'],[
  ['Thu nhập/tháng',numV(x.income)],['Tổng chi hiện tại/tháng',numV(current)],
  ['Tổng chi theo kế hoạch/tháng',numV(proposed)],['Nghĩa vụ nợ/tháng',numV(g.debt)],
  ['Quỹ dự phòng/tháng',numV(g.reserve)],
  ['Dư hoặc thiếu/tháng theo kế hoạch',numV(x.income-proposed-g.debt-g.reserve)],
  ['Mục tiêu',g.name||'Chưa đặt'],['Giá mục tiêu',numV(g.price)],
  ['Đã tích lũy',numV(g.saved)],['Thời hạn kế hoạch',String(g.months)+' tháng']]);
 add('h2','Chi tiêu theo danh mục');
 table(['Khoản chi','Hiện tại','Kế hoạch'],C.map(([id,label])=>[label,numV(x.cats[id]),numV(plan[id]??x.cats[id])]));
 add('h2','Lộ trình thu – chi (12 tháng)');
 let accumulated=Number(g.saved)||0;
 const inflation=(Number(g.inflation)||0)/100;
 const rows=[];
 for(let m=1;m<=12;m++){
   const expense=proposed*Math.pow(1+inflation,m/12),cashflow=x.income-expense-(Number(g.debt)||0)-(Number(g.reserve)||0);
   accumulated+=cashflow;rows.push(['Tháng '+m,numV(x.income),numV(expense),numV(cashflow),numV(accumulated)]);
 }
 table(['Kỳ','Thu nhập','Chi phí','Dư / thiếu','Tích lũy'],rows);
 const foot=add('p','Chỉ là mô phỏng: thu nhập, nợ và dự phòng giả định cố định. Giá chi tiêu có thể biến động khác kịch bản lạm phát đã chọn. Không bảo đảm thời gian đạt mục tiêu.');
 foot.className='fineprint';
 window.print();
}
